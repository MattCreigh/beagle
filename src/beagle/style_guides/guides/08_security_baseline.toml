# =============================================================================
# 08_security_baseline.toml — Security Baseline Floor (Tier 4, immutable)
# =============================================================================
# The immutable security floor. Applies to everything. Rendered into XML.
# This is the domain-agnostic minimum; language/domain guides extend it.
# =============================================================================

[meta]
name = "Security Baseline Floor"
applies_to = ["*"]
tier = 4
immutable = true
version = "14.0"

# ── Secrets ────────────────────────────────────────────────────────────────
[secrets]
delivery = "MEMORY_ONLY_JIT"
sanitization = "LINEAR_RE2_PRE_INGEST"
permissions = "secret files 0600 or 0400"
no_plaintext = "never persist unencrypted secrets"
loader = "load via secrets_loader.py — env vars first, then ~/.config/goose/secrets.yaml; open secret files with os.open() and explicit mode 0o600"
log_scrubbing = "scrub secrets from logs via _SECRET_PATTERNS (20+ char minimum); use Path.name, not the full path, for binaries in log messages"

# ── Cryptography ───────────────────────────────────────────────────────────
[crypto]
signing = "Ed25519 for A2A agent signing — raise RuntimeError if the key is missing"
hashing = "hashlib.sha256().hexdigest()[:48] for guardian hashes"
no_downgrade = "never downgrade crypto — no MD5, no SHA1 for security purposes"

# ── Sandbox ────────────────────────────────────────────────────────────────
[sandbox]
microvm = "DENY_BY_DEFAULT"
ast_validation = "BLOCK_UNSAFE_SYSCALLS"
fail_closed_firewall = true
deny_fallback_to_subprocess = true

# ── Validation ─────────────────────────────────────────────────────────────
[validation]
external_input = "validate all external input at system boundaries"
allowlists = "frozenset for dynamic identifiers (relation types, etc.)"
injection = "strip injection tags BEFORE html.escape(), not after"
path_traversal = "Path.relative_to() only"
queries = "parameterized queries only — never string interpolation for SQL/Cypher"
