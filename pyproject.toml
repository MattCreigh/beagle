[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beagle"
version = "1.4.0"
description = "Domain-agnostic autonomous agentic workflow system: multi-agent orchestration, hybrid RAG, MCP integration"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["agents", "orchestration", "rag", "mcp", "workflows", "llm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "langgraph==1.2.4",
    "langgraph-checkpoint==4.1.1",
    "langgraph-checkpoint-sqlite>=3.0.1",
    "langchain==1.3.9",
    "langchain-core>=1.2.22,<2",
    "pydantic>=2.13.3",
    "toml==0.10.2",
    "rich==15.0.0",
    "click==8.3.3",
    "mcp==1.28.1",
    "fastmcp==3.4.7",
    "faiss-cpu==1.13.2",
    "lancedb==0.30.2",
    "kuzu==0.11.3",
    "sentence-transformers>=5.4",
    # CPU-only torch pin; see README for GPU/CPU index guidance.
    "torch==2.11.0",
    "python-dotenv==1.2.2",
    "platformdirs>=4.0",
    "opentelemetry-api>=1.41",
    "opentelemetry-sdk>=1.41",
    "aiosqlite==0.22.1",
    "google-re2==1.1.20251105",
    "httpx>=0.28.0",
    "aiohttp==3.14.0",
    "typer>=0.24.0",
    "tenacity>=9.0.0",
    "pyyaml>=6.0",
    "PyJWT>=2.12.0",
    "PyNaCl>=1.6.0",
    "psutil>=7.0",
    "structlog>=24.0.0",
    "ddgs>=9.0",
    "defusedxml>=0.7.1",
    "jinja2>=3.1.6",
    "casbin>=1.30.0",
    # Beacon's default coordination backend (fakeredis_unix) imports redis at
    # module scope and the CLI imports beacon unconditionally — so both are
    # RUNTIME dependencies, not dev-only. Pure Python, no redis-server binary.
    "redis>=5.0",
    "fakeredis==2.37.1",
    # NOTE: no proprietary dependencies ship by default. The optional
    # beagle-orpheus transport wheel is downloaded and installed EXPLICITLY
    # by the operator after an informed licensing decision (see README).
]

[project.scripts]
goose-workflow = "beagle.cli.cli:main"
beagle = "beagle.cli.cli:main"

[project.entry-points."beagle.runtimes"]
goose_cli = "beagle.runtime.loader:_goose_cli_factory"
http_agent = "beagle.runtime.http_agent:http_agent_factory"

# Transport plugins (e.g. the proprietary beagle-orpheus wheel) register here:
#   [project.entry-points."beagle.transports"]
#   orpheus = "beagle_orpheus.transport:factory"
# Detection is automatic once installed; ACTIVATION requires explicit config.

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.3",
    "hypothesis>=6.0",
    "mypy>=1.10",
    "ruff>=0.16.0",
    "types-PyYAML",
    "types-toml",
]
observability = [
    "prometheus_client>=0.21.0",
]
scraping = [
    "beautifulsoup4>=4.12.0",
]
code_parsing = [
    "tree-sitter-languages>=1.10.0",
]
tui = [
    "textual>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The DOCTRINE defaults ship with the wheel so a clean install (no config
# root seeded) still loads a coherent Top-of-Mind and the doctrine-coherence
# gates pass in CI. An operator who seeds `~/.config/beagle/style_guides`
# (via `beagle config init`) DEFERS entirely to that config-root guide set —
# the shipped guides are the fallback, not the override. All other
# user-editable config lives in ~/.config/beagle, NOT in the wheel.
beagle = [
    "py.typed",
    "skills/*.xml",
    "blocks/xml_blocks/stdlib/*.xml",
    "prompts/*.md",
    "recipes/*.xml",
    "templates/definitions/*.toml",
    "style_guides/guides/*.toml",
    "infrastructure/Dockerfile.*",
    "infrastructure/docker-compose.yml",
]

[tool.ruff]
line-length = 100
# D-19 (release-readiness audit 2026-08-28): aligned to the runtime floor.
# .python-version, CI (3.13) and the deployed venv all run 3.13; target-version
# must match so ruff applies the same syntax/lint rules the runtime enforces.
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
# D-19: aligned to the runtime floor (3.13 everywhere: .python-version, CI,
# deployed venv). A mypy python_version below the runtime lets type
# inference diverge from what actually executes.
python_version = "3.13"
mypy_path = "src"
ignore_missing_imports = true

# D-13: mypy strict ratchet — progressively enabled strict flags
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_optional = true

