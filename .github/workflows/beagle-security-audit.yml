name: Beagle Security Audit

on:
  schedule:
    # Run daily at 9 AM UTC
    - cron: '0 9 * * *'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Target to audit (codebase, dependencies, all)'
        required: false
        default: 'all'

jobs:
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety pip-audit semgrep
          pip install -e .

      - name: Run Bandit (Python security linter)
        run: |
          bandit -r src/beagle/ -f json -o bandit-results.json
          bandit -r src/beagle/ -f txt

      - name: Run Safety (dependency vulnerability check)
        run: |
          safety check --json > safety-results.json
          safety check

      - name: Run pip-audit
        run: |
          pip-audit --json > pip-audit-results.json
          pip-audit

      - name: Run Semgrep (static analysis)
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}

      - name: Generate SARIF report
        run: |
          python -c "
          import json
          from pathlib import Path

          # Combine results into SARIF format
          sarif = {
            'version': '2.1.0',
            'runs': []
          }

          # Add Bandit results
          if Path('bandit-results.json').exists():
              with open('bandit-results.json') as f:
                  bandit = json.load(f)
                  # Convert to SARIF format
                  # ... conversion logic ...

          # Add Safety results
          if Path('safety-results.json').exists():
              with open('safety-results.json') as f:
                  safety = json.load(f)
                  # Convert to SARIF format
                  # ... conversion logic ...

          with open('security-audit.sarif', 'w') as f:
              json.dump(sarif, f, indent=2)
          "

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: security-audit.sarif
        continue-on-error: true

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-results
          path: |
            bandit-results.json
            safety-results.json
            pip-audit-results.json
            security-audit.sarif

      - name: Create issue if vulnerabilities found
        uses: actions/github-script@v7
        if: failure()
        with:
          script: |
            const fs = require('fs');

            // Read results and create issue
            const bandit = fs.existsSync('bandit-results.json')
              ? JSON.parse(fs.readFileSync('bandit-results.json'))
              : {};

            const safety = fs.existsSync('safety-results.json')
              ? JSON.parse(fs.readFileSync('safety-results.json'))
              : {};

            // Count high/critical issues
            const highSeverity = (bandit.results || []).filter(r => r.issue_severity === 'HIGH').length;
            const mediumSeverity = (bandit.results || []).filter(r => r.issue_severity === 'MEDIUM').length;

            if (highSeverity > 0 || mediumSeverity > 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🔒 Security Audit: ${highSeverity} high, ${mediumSeverity} medium severity issues found`,
                body: `
            ## Security Audit Results

            **Date:** ${new Date().toISOString().split('T')[0]}

            ### Summary
            - **High Severity:** ${highSeverity}
            - **Medium Severity:** ${mediumSeverity}

            ### Action Required
            Please review the uploaded artifacts for details.

            Run ID: ${context.runId}
                `,
                labels: ['security', 'automated']
              });
            }

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  # ── Supply-chain CVE scanner (osv-scanner + pip-audit against lock file) ──
  # DELTA-PROC-1: Automated transitive dependency scanning to catch CVEs
  # like CVE-2025-68664 (LangGrinch), CVE-2026-34070 (path traversal),
  # and CVE-2025-67644 (SQLi) before they reach production.

  osv-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@v2.0.1
        with:
          scan-args: |-
            --lockfile=./uv.lock
            --format=sarif
            --output=osv.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: osv.sarif

  pip-audit-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv export --frozen --no-dev -o requirements-frozen.txt
      - run: uvx pip-audit -r requirements-frozen.txt --strict

  codeql-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
