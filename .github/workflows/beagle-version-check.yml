name: Version Consistency Check

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-consistency:
    name: Verify __version__ matches git tag
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Extract __version__ from package
        id: version
        run: |
          # v1.0.4 (audit E2): since v1.0.0 the package lives in src/ (the
          # `beagle` package IS the src/ directory via package-dir mapping), so
          # `from beagle import __version__` previously failed on a fresh
          # checkout because neither the package was installed nor src/ put on
          # the path. Setting PYTHONPATH=src makes the import resolve without a
          # slow full install; the version gate must not depend on PyPI.
          PYTHON_VERSION=$(PYTHONPATH=src python3 -c "from beagle import __version__; print(__version__)")
          echo "version=$PYTHON_VERSION" >> $GITHUB_OUTPUT
          echo "Package version: $PYTHON_VERSION"

      - name: Compare against git tag (if tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION="${{ steps.version.outputs.version }}"
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Package: $PKG_VERSION"
          echo "Tag:     $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch! Package is $PKG_VERSION but tag is $TAG_VERSION"
            exit 1
          fi

      - name: Compare against pyproject.toml
        run: |
          PKG_VERSION="${{ steps.version.outputs.version }}"
          PYPROJECT_VERSION=$(grep -E '^version\s*=' pyproject.toml | head -1 \
            | sed -E 's/version\s*=\s*"([^"]+)".*/\1/')
          echo "Package:    $PKG_VERSION"
          echo "pyproject:  $PYPROJECT_VERSION"
          if [ "$PKG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Version mismatch! Package is $PKG_VERSION but pyproject.toml is $PYPROJECT_VERSION"
            exit 1
          fi

      - name: Assert README version badge matches pyproject
        run: |
          # The README now carries a static version badge (user-facing info).
          # Single-sourcing is preserved by pinning the badge text to
          # pyproject.toml here: the badge must exist and must equal the
          # pyproject version, or the build fails. Bump both together at
          # release time (the badge is the only sanctioned version literal
          # in the README; the no-stray-literals check below still applies).
          BADGE_VERSION=$(grep -oE 'badge/version-[0-9]+\.[0-9]+\.[0-9]+' README.md | head -n1 \
            | cut -d- -f2-)
          PYPROJECT_VERSION=$(grep -E '^version\s*=' pyproject.toml | head -1 \
            | sed -E 's/version\s*=\s*"([^"]+)".*/\1/')
          echo "badge:     $BADGE_VERSION"
          echo "pyproject: $PYPROJECT_VERSION"
          if [ -z "$BADGE_VERSION" ]; then
            echo "::error::README.md is missing a version badge (img.shields.io/badge/version-X.Y.Z)"
            exit 1
          fi
          if [ "$BADGE_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Version mismatch! README badge is $BADGE_VERSION but pyproject.toml is $PYPROJECT_VERSION"
            exit 1
          fi

      - name: Assert README title carries the pyproject version
        run: |
          # The README H1 title is "# Beagle <version>" — the version is
          # pinned to pyproject.toml here so it can never lag the release.
          # Bump pyproject.toml and the title together at release time.
          TITLE=$(head -n1 README.md \
            | grep -oE 'Beagle [0-9]+\.[0-9]+\.[0-9]+' \
            | awk '{print $2}')
          PYPROJECT_VERSION=$(grep -E '^version\s*=' pyproject.toml | head -1 \
            | sed -E 's/version\s*=\s*"([^"]+)".*/\1/')
          echo "title:      # Beagle $TITLE"
          echo "pyproject:  $PYPROJECT_VERSION"
          if [ -z "$TITLE" ]; then
            echo "::error::README.md H1 must be '# Beagle <version>' (got: $(head -n1 README.md))"
            exit 1
          fi
          if [ "$TITLE" != "$PYPROJECT_VERSION" ]; then
            echo "::error::README title version $TITLE != pyproject.toml version $PYPROJECT_VERSION"
            exit 1
          fi

      - name: Check no-hardcoded-version-string
        run: |
          # Run the hook against all changed python files in the PR
          # (the local pre-commit hook enforces the same rule on the
          # developer's machine).
          pip install pre-commit
          pre-commit run no-hardcoded-version-string --all-files
          # A finding here fails the build (v1.2.0, QA-5, BGL-072).

      - name: Assert the README carries no version literal
        run: |
          # v1.2.0 (QA-5, BGL-075): commit deea840 made README.md
          # deliberately version-agnostic — the installed version is
          # single-sourced from pyproject.toml and resolved at import
          # time. A version literal in README.md would re-introduce the
          # drift this gate exists to prevent, so this step fails the
          # build when one appears.
          if grep -oE "v[0-9]+\.[0-9]+\.[0-9]+" README.md; then
            echo "::error::README.md contains a version literal; it must stay version-agnostic"
            exit 1
          fi
