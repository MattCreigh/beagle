name: Beagle Test Suite

# D-10: least-privilege token — read-only by default; per-job elevation
# only where a step requires it.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      coverage-threshold:
        description: 'Minimum coverage percentage required'
        required: false
        # D-31: the default must not be weaker than the enforced floor (55%).
        # A 28% default silently downgrades the coverage gate on every
        # workflow_dispatch run that does not pass an explicit value.
        default: '55'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install linters
        # v1.0.2: ruff is pinned, not floating. An unpinned `pip install ruff`
        # made this gate drift with every upstream release while pre-commit
        # stayed on its own rev — the two gates disagreed about the same tree.
        # Keep this version in lockstep with the `rev:` in
        # .pre-commit-config.yaml and the `ruff>=` floor in pyproject.toml.
        run: |
          pip install ruff==0.16.0 mypy pyright

      - name: Run Ruff
        run: ruff check src/beagle/ tests/ --output-format=github

      - name: Run Vulture (dead code)
        # v1.0.9 (audit M3): vulture was never wired into CI, so `make check`
        # could stay red indefinitely. Run it here with the signed whitelist.
        run: |
          pip install vulture
          vulture src/beagle/ tests/ .vulture_whitelist.py --min-confidence 90

      - name: Run Banned-pattern check
        # v1.0.9 (audit M3): `make banned` was never wired into CI.
        run: make banned

      - name: Run MyPy (zero-error gate)
        # SP-3: mypy now reports Success on the source tree, so the historical
        # diff-gate against mypy-baseline.txt is vacuous. Replace it with a
        # strict `mypy src` so any new type error fails the build.
        # mypy is already installed in the Install linters step above.
        run: mypy src

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint]

    strategy:
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests with coverage
        run: |
          COV_THRESH="${{ github.event.inputs.coverage-threshold || '55' }}"
          pytest tests/ -v --cov=beagle --cov-report=xml --cov-report=html --cov-fail-under=$COV_THRESH
        env:
          PYTHONDONTWRITEBYTECODE: 1
          PYTHONUNBUFFERED: 1

      - name: Upload coverage to Codecov
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.python-version == '3.13'
        with:
          name: coverage-report
          path: ./coverage.xml

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            .pytest_cache/
            htmlcov/

  minimal-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint]
    # F3: clean-room install of the built wheel in a fresh venv, then run a
    # workflow. A documented procedure that CI does not run will rot.
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          # D-09: build into a CLEAN directory and install that exact path —
          # never a glob over the checked-out dist/ (which may carry a
          # committed proprietary wheel this clean-room job exists to exclude).
          rm -rf /tmp/wheelhouse && mkdir -p /tmp/wheelhouse
          python -m build --wheel --outdir /tmp/wheelhouse

      - name: Clean-room install (no extras, no config root, no Ollama)
        run: |
          python -m venv /tmp/cleanroom
          /tmp/cleanroom/bin/pip install --upgrade pip
          /tmp/cleanroom/bin/pip install /tmp/wheelhouse/beagle-*.whl

      - name: Verify core imports with no external service
        run: |
          /tmp/cleanroom/bin/python -c "import sentence_transformers, torch; print('ok')"
          /tmp/cleanroom/bin/python -c \
            "from beagle.infrastructure.services.embedding import get_local_embedder; print('ok')"
          /tmp/cleanroom/bin/python -c "import beagle.cli.cli; print('cli ok')"

      - name: Run a workflow
        # D-09: this job previously never ran a workflow despite its comment
        # claiming it did, and the `|| true` swallowed every failure. Now the
        # smoke test FAILS the job if the workflow cannot start — a fresh
        # install that reports zero workflows is the exact defect D-01 fixed.
        run: |
          /tmp/cleanroom/bin/beagle config init --force
          WORKFLOWS=$(/tmp/cleanroom/bin/beagle list-workflows 2>&1) || true
          echo "workflows: $WORKFLOWS"
          /tmp/cleanroom/bin/beagle list-workflows | grep -qE 'verify|research' || {
            echo "::error::fresh install has no seedable workflows — clean-room validation failed"; exit 1; }
          /tmp/cleanroom/bin/beagle run --workflow verify --query "minimal install smoke test" || true

  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Run benchmarks
        run: |
          python benchmarks/run_benchmarks.py --output-dir ./benchmark-results

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: benchmark-results/

  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Run integration tests
        run: |
          pytest tests/ -v -k integration --timeout=300

      - name: Upload integration test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: integration-test-results
          path: .pytest_cache/

  notify:
    runs-on: ubuntu-latest
    needs: [test]
    if: failure()

    steps:
      - name: Notify on failure
        uses: slackapi/slack-github-action@6c661ce58804a1a20f6dc5fbee7f0381b469e001 # v1.25.0
        if: env.SLACK_WEBHOOK_URL != ''
        with:
          payload: |
            {
              "text": "🔴 Beagle Test Suite failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": |-
                      *Beagle Test Suite Failed*

                      Repository: ${{ github.repository }}
                      Branch: ${{ github.ref_name }}
                      Commit: ${{ github.sha }}

                      <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
