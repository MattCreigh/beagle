name: Beagle SBOM (Software Bill of Materials)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # actions:read is required by the release-attach job to read workflow
  # artifacts. No security-events:write — the CycloneDX SBOM is NOT SARIF
  # (D-32) and is no longer uploaded to Code Scanning; it ships as a
  # release-attached artifact instead.
  actions: read

jobs:
  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Install cyclonedx-bom
        run: |
          pip install cyclonedx-bom

      - name: Sync deps (dev extras)
        run: |
          # --dev (not --all-extras): the `code_parsing` extra pulls
          # tree-sitter-languages==1.10.2, which ships cp312-only wheels and
          # cannot install on the cp313 CI runner. SBOM generation reads the
          # resolved dependency graph (cyclonedx-py environment + uv export
          # fallback); it does not need tree-sitter installed.
          uv sync --dev

      - name: Generate SBOM (CycloneDX JSON)
        run: |
          cyclonedx-py environment \
            --output-format JSON \
            --output-file sbom.cdx.json \
            --spec-version 1.5 \
            --pyproject pyproject.toml || true
          # Fall back to pip-installed-tree-based generation if pyproject
          # resolution fails:
          if [ ! -s sbom.cdx.json ]; then
            uv export --frozen --no-dev -o requirements-frozen.txt
            cyclonedx-py requirements \
              --output-format JSON \
              --output-file sbom.cdx.json \
              --spec-version 1.5 \
              requirements-frozen.txt || true
          fi

      - name: Generate SBOM (CycloneDX XML)
        run: |
          cyclonedx-py environment \
            --output-format XML \
            --output-file sbom.cdx.xml \
            --spec-version 1.5 \
            --pyproject pyproject.toml || true
          if [ ! -s sbom.cdx.xml ]; then
            uv export --frozen --no-dev -o requirements-frozen.txt
            cyclonedx-py requirements \
              --output-format XML \
              --output-file sbom.cdx.xml \
              --spec-version 1.5 \
              requirements-frozen.txt || true
          fi

      - name: Validate SBOM is non-empty
        run: |
          test -s sbom.cdx.json
          test -s sbom.cdx.xml
          echo "SBOM JSON size: $(wc -c < sbom.cdx.json) bytes"
          echo "SBOM XML  size: $(wc -c < sbom.cdx.xml) bytes"

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-cyclonedx
          path: |
            sbom.cdx.json
            sbom.cdx.xml
          retention-days: 90

  release-sbom:
    name: Attach SBOM to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download SBOM artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom-cyclonedx
          path: sbom

      - name: Upload SBOM to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            sbom/sbom.cdx.json
            sbom/sbom.cdx.xml
          fail_on_unmatched_files: true
